plugins {
    id "com.android.application"
}

android {
    namespace "app.helios"
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "app.helios.solar"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1-test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

tasks.register("buildWeb", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine System.getProperty("os.name").toLowerCase().contains("windows") ? "npm.cmd" : "npm", "run", "build:apk-web"
    inputs.files(fileTree("${rootProject.projectDir.parent}/src"), fileTree("${rootProject.projectDir.parent}/apk"), fileTree("${rootProject.projectDir.parent}/public/textures"))
    inputs.files("${rootProject.projectDir.parent}/package-lock.json", "${rootProject.projectDir.parent}/vite.apk.config.ts")
    outputs.dir("src/main/assets/www")
}
tasks.named("preBuild").configure { dependsOn("buildWeb") }
